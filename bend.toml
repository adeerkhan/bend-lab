[project]
name = "mlbend"
version = "0.1.0"
description = "Machine learning for Bend 2, in the shape scikit-learn has."

[dependencies]
bend-ml-autograd = "*"
bend-ml-bpe-tokenizer = "*"
bend-ml-tensor = "0.1.0.0"
bend-ml-tensor-array = "*"
bend-ml-tensor-fork = "*"
bend-ml-tensor-gpu = "0.1.5.0"
bendtorch = "1.1.1.0"
bendtorch-gpu = "1.1.1.0"

[workspace]
members = [
    "metrics",
    "hf",
    "datasets",
    "preprocess",
    "split",
    "select",
    "cluster",
    "pipeline",
    "report",
    "generative",
]

[workspace.dependencies]
bend-kit-random = "0.1.0.1"
bend-ml-autograd = "0.1.1.0"
bend-ml-nat-lemmas = "0.1.1.0"
bend-ml-tensor-array = "0.1.14.0"
bendtorch = "1.1.1.0"
bendtorch-gpu = "1.1.1.0"
